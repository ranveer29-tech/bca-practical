<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <h1>job application for html</h1>
 <div>
    full name:
    <input type="text" id="name" name="fullname" placeholder="Enter your name">
 </div>
 <br>
 <div>
    email:
    <input type="text" id="email" name="email" placeholder="Enter your email">
    </div>
    <br>
    <div>
    phone number:
    <input type="number" id="phone" name="phone" placeholder="Enter your phone number">
 </div>
 <br>
<div>
    upload your file:
    <input type="file" accept=".jpg, .jpeg, .png" id="file" name="file">
</div>
 <br>
 experience:
 <div>
    <input type="radio" id="fresher" name="experience" value="fresher">
    <label for="fresher">Fresher</label>
    <input type="radio" id="1-2 years" name="experience" value="1-2 years">
    <label for="1-2 years">1-2 Years</label>
    <input type="radio" id="3-5 years" name="experience" value="3-5 years">
    <label for="3-5 years">3-5 Years</label>
</div>
<br>
    courses:
    <div>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills" value="js">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="c" name="skills" value="c">
        <label for="c">C</label>
        <input type="checkbox" id="SQL" name="skills" value="SQL">
        <label for="SQL">SQL</label>
    </div>
    <br>
    textarea:
 <div>
    <textarea name="message" placeholder="Enter your message"></textarea>
 </div>
 <div>
    <br>
    submit:
    <button type="submit">Submit</button>
    <br><br>
    reset:
    <button type="reset">Reset</button>
 </div>
</body>
</html>
